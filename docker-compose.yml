  ##     N8N_HOST: localhost
  ##     N8N_PROTOCOL: http
  ##     N8N_PORT: 5678
  ##     GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
  ##   ports:
  ##     - "5678:5678"
  ##   volumes:
  ##     - n8n_data:/home/node/.n8n
  ##   depends_on:
  ##     - quantum-api

volumes:
  redis_data:
  n8n_data:
